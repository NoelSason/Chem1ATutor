<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Chem 1A Tutor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-db.js"></script>
    <style>
        .leaderboard-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .leaderboard-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .leaderboard-title {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }

        .leaderboard-filters {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 30px;
        }

        .filter-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--primary-500);
            color: white;
            border-color: var(--primary-500);
        }

        .leaderboard-card {
            background: var(--bg-secondary);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        .leaderboard-table th {
            text-align: left;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .leaderboard-table td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .rank-cell {
            font-weight: 700;
            width: 60px;
            text-align: center;
        }

        .rank-1 {
            color: #FFD700;
            font-size: 1.2rem;
        }

        .rank-2 {
            color: #C0C0C0;
            font-size: 1.1rem;
        }

        .rank-3 {
            color: #CD7F32;
            font-size: 1.05rem;
        }

        .user-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar-small {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary-500);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .points-cell {
            font-weight: 700;
            text-align: right;
            color: var(--primary-400);
        }

        .user-rank-card {
            background: var(--bg-tertiary);
            border-radius: 16px;
            padding: 20px;
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--primary-500);
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <a href="index.html" class="logo">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                    </div>
                    <h1>Chem 1A Tutor</h1>
                </a>
            </div>

            <div class="header-right">
                <a href="practice.html" class="btn btn-secondary"
                    style="margin-right: 10px; border: none; background: transparent;">Practice</a>
                <a href="leaderboard.html" class="btn btn-secondary"
                    style="margin-right: 10px; border: none; background: transparent;">Leaderboard</a>
                <a href="mistakes.html" class="btn btn-secondary"
                    style="margin-right: 10px; border: none; background: transparent;">Journal</a>
                <a href="profile.html" class="user-profile hidden" id="userProfile"
                    style="text-decoration: none; color: inherit;">
                    <span class="user-name" id="userName">User</span>
                    <div class="avatar" id="userAvatar">U</div>
                </a>
            </div>
        </header>

        <!-- Main Content -->
        <div class="leaderboard-container">
            <div class="leaderboard-header">
                <h1 class="leaderboard-title">Leaderboard</h1>
                <p class="subtitle">Top students mastering Chemistry 1A</p>
            </div>

            <div class="leaderboard-filters">
                <button class="filter-btn active" data-type="total" onclick="switchTab('total')">All Time</button>
                <button class="filter-btn" data-type="weekly" onclick="switchTab('weekly')">This Week</button>
                <button class="filter-btn" data-type="monthly" onclick="switchTab('monthly')">This Month</button>
            </div>

            <div class="leaderboard-card">
                <table class="leaderboard-table" id="leaderboardTable">
                    <thead>
                        <tr>
                            <th class="rank-cell">#</th>
                            <th>Student</th>
                            <th>School</th>
                            <th style="text-align: right;">Points</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <!-- Content loaded by JS -->
                        <tr>
                            <td colspan="4" class="loading-spinner">Loading leaderboard...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Current User Rank (Fixed at bottom or floating) -->
            <div id="currentUserRank" class="user-rank-card hidden">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div class="rank-cell" id="myRank">--</div>
                    <div class="user-cell">
                        <div class="user-avatar-small" id="myAvatar">U</div>
                        <div>
                            <div style="font-weight: 600;">You</div>
                            <div style="font-size: 0.8rem; color: var(--text-secondary);" id="mySchool">No school</div>
                        </div>
                    </div>
                </div>
                <div class="points-cell" id="myPoints">0 pts</div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        let currentUser = null;
        let currentTab = 'total';

        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('chemTutorUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                updateHeader();
                loadMyRank();
            }
            loadLeaderboard('total');
        });

        function updateHeader() {
            const profile = document.getElementById('userProfile');
            const nameEl = document.getElementById('userName');
            const avatarEl = document.getElementById('userAvatar');
            const myAvatar = document.getElementById('myAvatar');

            nameEl.textContent = currentUser.name;
            profile.classList.remove('hidden');

            if (currentUser.avatar && currentUser.avatar.startsWith('http')) {
                avatarEl.style.backgroundImage = `url(${currentUser.avatar})`;
                avatarEl.style.backgroundSize = 'cover';
                avatarEl.textContent = '';

                myAvatar.style.backgroundImage = `url(${currentUser.avatar})`;
                myAvatar.style.backgroundSize = 'cover';
                myAvatar.textContent = '';
            } else {
                const initial = currentUser.name.charAt(0).toUpperCase();
                avatarEl.textContent = initial;
                myAvatar.textContent = initial;
            }
        }

        async function switchTab(type) {
            currentTab = type;

            // Update buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.type === type) btn.classList.add('active');
            });

            // Reload data
            document.getElementById('leaderboardBody').innerHTML = `
                <tr><td colspan="4" class="loading-spinner">Loading...</td></tr>
            `;

            await loadLeaderboard(type);
            if (currentUser) await loadMyRank();
        }

        async function loadLeaderboard(type) {
            try {
                // Ensure db functions are loaded
                if (typeof getLeaderboardDB !== 'function') {
                    // Start retrying if supabase-db.js hasn't loaded properly yet
                    setTimeout(() => loadLeaderboard(type), 500);
                    return;
                }

                const data = await getLeaderboardDB(type, 50);
                renderLeaderboard(data);
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                document.getElementById('leaderboardBody').innerHTML = `
                    <tr><td colspan="4" style="text-align: center; padding: 20px; color: #ef4444;">Failed to load leaderboard</td></tr>
                `;
            }
        }

        function renderLeaderboard(users) {
            const tbody = document.getElementById('leaderboardBody');

            if (users.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="4" style="text-align: center; padding: 40px; color: var(--text-secondary);">No scores yet. Be the first!</td></tr>
                `;
                return;
            }

            tbody.innerHTML = users.map((user, index) => {
                const rank = index + 1;
                let rankClass = '';
                if (rank === 1) rankClass = 'rank-1';
                else if (rank === 2) rankClass = 'rank-2';
                else if (rank === 3) rankClass = 'rank-3';
                else rankClass = 'rank-cell';

                const points = currentTab === 'total' ? user.total_points :
                    (currentTab === 'weekly' ? user.weekly_points : user.monthly_points);

                return `
                    <tr class="${currentUser && user.user_email === currentUser.email ? 'bg-primary-500/10' : ''}">
                        <td class="${rankClass}" style="text-align: center;">${rank === 1 ? '🥇' : (rank === 2 ? '🥈' : (rank === 3 ? '🥉' : rank))}</td>
                        <td>
                            <div class="user-cell">
                                <div class="user-avatar-small">${user.user_name.charAt(0).toUpperCase()}</div>
                                <span style="font-weight: 500;">${user.user_name}</span>
                                ${currentUser && user.user_email === currentUser.email ? '<span style="font-size: 10px; background: var(--primary-500); padding: 2px 6px; border-radius: 10px; color: white;">YOU</span>' : ''}
                            </div>
                        </td>
                        <td style="color: var(--text-secondary);">${user.school || '-'}</td>
                        <td class="points-cell">${points.toLocaleString()} pts</td>
                    </tr>
                `;
            }).join('');
        }

        async function loadMyRank() {
            if (!currentUser) return;

            try {
                const rankContainer = document.getElementById('currentUserRank');
                const rankEl = document.getElementById('myRank');
                const pointsEl = document.getElementById('myPoints');

                const rank = await getUserRankDB(currentUser.email, currentTab);

                if (rank) {
                    rankContainer.classList.remove('hidden');
                    rankEl.textContent = rank;

                    // Fetch my current points
                    // We could optimize this by getting it from the list if present
                    const scores = await getLeaderboardDB(currentTab, 100);
                    const me = scores.find(u => u.user_email === currentUser.email);

                    if (me) {
                        const points = currentTab === 'total' ? me.total_points :
                            (currentTab === 'weekly' ? me.weekly_points : me.monthly_points);
                        pointsEl.textContent = `${points.toLocaleString()} pts`;
                        document.getElementById('mySchool').textContent = me.school || 'No school';
                    }
                }
            } catch (error) {
                console.error('Error loading rank:', error);
            }
        }
    </script>
</body>

</html>
