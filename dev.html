<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Panel - Chem 1A Tutor</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    <h1>Chem 1A Tutor - Dev Panel</h1>
                </div>
                <a href="index.html" class="btn btn-secondary">← Back to Home</a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dev-panel-container">
                <!-- School Info -->
                <div class="dev-section">
                    <h2>🏫 School Administration</h2>
                    <p class="text-secondary">Admin-only access for managing user roles and permissions</p>
                    <div style="margin-top: var(--space-sm);">
                        <span class="badge badge-primary" id="schoolBadge">Loading...</span>
                    </div>
                </div>

                <!-- Navigation Tabs -->
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('classes')">📚 Classes</button>
                </div>

                <!-- Classes Tab -->
                <div id="classesView" class="tab-content active">
                    <div class="section-header">
                        <h2>📚 Class Management</h2>
                    </div>

                    <!-- Create Class Form -->
                    <div class="dev-form">
                        <div class="form-group">
                            <label for="classCode">Class Code</label>
                            <input type="text" id="classCode" class="form-input" placeholder="e.g., CHEM 1A">
                        </div>
                        <div class="form-group">
                            <label for="classFullName">Full Name</label>
                            <input type="text" id="classFullName" class="form-input"
                                placeholder="e.g., General Chemistry">
                        </div>
                        <div class="form-group">
                            <label for="classDescription">Description</label>
                            <textarea id="classDescription" class="form-input" rows="3"
                                placeholder="Brief description of the class"></textarea>
                        </div>
                        <button class="btn btn-primary" onclick="createClassFromInput()">Create Class</button>
                    </div>

                    <!-- Classes List -->
                    <div class="classes-list" style="margin-top: var(--space-lg);">
                        <h4>Current Classes</h4>
                        <div id="classesList" class="list-container">
                            <!-- Classes will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Initialize Supabase (works on both localhost and Vercel)
        const SUPABASE_URL = 'https://yreeccqkuhijinfrlxzl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlyZWVjY3FrdWhpamluZnJseHpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUyODg5ODcsImV4cCI6MjA4MDg2NDk4N30.EmmhQhihfq2Yl661kkklzNNuTBOYc0X1WJAkaZ3RHFE';

        let supabase = null;

        // Create Supabase client
        if (typeof window.supabase !== 'undefined') {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('✅ Supabase initialized');
        } else {
            console.error('❌ Supabase library not loaded');
        }
    </script>
    <script src="supabase-db.js"></script>
    <script src="roles.js"></script>
    <script src="dev.js"></script>
</body>

</html>
