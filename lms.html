<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Dashboard - Chem 1A Tutor</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    <h1>Chem 1A Tutor - LMS Dashboard</h1>
                </div>
                <a href="index.html" class="btn btn-secondary">← Back to Home</a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="lms-container">
                <!-- Navigation Tabs -->
                <div class="lms-nav">
                    <button class="lms-nav-btn active" onclick="showView('classes')">📚 My Classes</button>
                    <button class="lms-nav-btn" onclick="showView('sessions')">📋 Session History</button>
                    <button class="lms-nav-btn" onclick="showView('students')">👥 Students</button>
                    <button class="lms-nav-btn" onclick="showView('analytics')">📊 Analytics</button>
                </div>


                <!-- My Classes View -->
                <div id="classesView" class="lms-view">
                    <div class="view-header">
                        <h2>My Classes</h2>
                        <p class="text-secondary">Classes you're teaching this semester</p>
                    </div>

                    <div id="myClassesGrid" class="classes-grid">
                        <!-- Classes will be loaded here -->
                    </div>
                </div>

                <!-- Session History View -->
                <div id="sessionsView" class="lms-view hidden">
                    <div class="view-header">
                        <h2>Session History</h2>
                        <div style="display: flex; gap: var(--space-sm);">
                            <button class="btn btn-secondary" onclick="exportSessionsCSV()">📥 Export CSV</button>
                            <button class="btn btn-error" onclick="clearAllHistory()">🗑️ Clear History</button>
                        </div>
                    </div>

                    <div id="sessionsList" class="sessions-grid">
                        <!-- Sessions will be loaded here -->
                    </div>
                </div>

                <!-- Students View -->
                <div id="studentsView" class="lms-view hidden">
                    <div class="view-header">
                        <h2>Student Profiles</h2>
                        <button class="btn btn-secondary" onclick="exportStudentsCSV()">📥 Export CSV</button>
                    </div>

                    <div id="studentsList" class="students-grid">
                        <!-- Students will be loaded here -->
                    </div>
                </div>

                <!-- Analytics View -->
                <div id="analyticsView" class="lms-view hidden">
                    <div class="view-header">
                        <h2>Analytics Dashboard</h2>
                    </div>

                    <div class="analytics-grid">
                        <div class="stat-card">
                            <h3>Total Sessions</h3>
                            <div class="stat-value" id="totalSessions">0</div>
                        </div>
                        <div class="stat-card">
                            <h3>Total Students</h3>
                            <div class="stat-value" id="totalStudents">0</div>
                        </div>
                        <div class="stat-card">
                            <h3>Avg. Attendance</h3>
                            <div class="stat-value" id="avgAttendance">0</div>
                        </div>
                        <div class="stat-card">
                            <h3>Questions Asked</h3>
                            <div class="stat-value" id="totalQuestions">0</div>
                        </div>
                    </div>

                    <div class="analytics-details">
                        <h3>Session Performance</h3>
                        <div id="sessionPerformance"></div>
                    </div>
                </div>
            </div>

            <!-- Session Detail Modal -->
            <div id="sessionDetailModal" class="modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 id="modalSessionCode">Session Details</h2>
                        <button class="btn-close" onclick="closeSessionDetail()">×</button>
                    </div>
                    <div class="modal-body" id="sessionDetailContent">
                        <!-- Session details will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Student Detail Modal -->
            <div id="studentDetailModal" class="modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2 id="modalStudentName">Student Profile</h2>
                        <button class="btn-close" onclick="closeStudentDetail()">×</button>
                    </div>
                    <div class="modal-body" id="studentDetailContent">
                        <!-- Student details will be loaded here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="supabase-config.js"></script>
    <script src="supabase-db.js"></script>
    <script src="roles.js"></script>
    <script src="lms.js"></script>
    <script>
        // Check access on page load
        (function () {
            const user = requireLogin();
            if (!user) return;

            const userRole = getUserRole(user.email);

            // Allow teacher, admin, and owner
            if (userRole !== 'teacher' && userRole !== 'admin' && userRole !== 'owner') {
                alert('Access denied. This page is for teachers only.');
                window.location.href = 'index.html';
                return;
            }
        })();
    </script>
</body>

</html>
